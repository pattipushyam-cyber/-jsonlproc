[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonlproc"
version = "0.1.0"
description = "Streaming JSON Lines processor — filter, project, aggregate, and sort without loading files into memory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["jsonl", "streaming", "data-processing", "cli", "json-lines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
fast = ["orjson>=3.0"]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
]

[project.scripts]
jsonlproc = "jsonlproc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jsonlproc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools]
zip-safe = false
